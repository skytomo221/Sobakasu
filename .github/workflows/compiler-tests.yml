name: Compiler Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-tests:
    name: Compiler Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build compiler
        run: dotnet build Sobakasu.Compiler.Standalone.csproj

      - name: Run compiler tests
        run: dotnet test Sobakasu.Compiler.Standalone.Tests.csproj

      - name: Build Standard Library Generator standalone CLI
        run: dotnet build Sobakasu.StandardLibraryGenerator.Standalone.csproj

      - name: Run Standard Library Generator standalone projection tests
        run: dotnet test Sobakasu.StandardLibraryGenerator.Standalone.Tests.csproj

      - name: Generate Standard Library with standalone CLI
        shell: bash
        run: |
          root="$(mktemp -d)"
          dotnet run --no-build --project Sobakasu.StandardLibraryGenerator.Standalone.csproj -- \
            --project "$GITHUB_WORKSPACE" \
            --output "$root/StandardLibrary" \
            --diagnostics "$root/Diagnostics"
          test -f "$root/Diagnostics/generation_report.json"
          test -n "$(find "$root/StandardLibrary" -type f -name '*.library.sobakasu' -print -quit)"

      - name: Reject invalid standalone CLI arguments
        shell: bash
        run: |
          if dotnet run --no-build --project Sobakasu.StandardLibraryGenerator.Standalone.csproj -- --unknown value; then
            echo "Unknown option unexpectedly succeeded." >&2
            exit 1
          fi
          if dotnet run --no-build --project Sobakasu.StandardLibraryGenerator.Standalone.csproj -- --catalog; then
            echo "Missing option value unexpectedly succeeded." >&2
            exit 1
          fi
          missing="$(mktemp -u)/udon-api-catalog.json"
          if dotnet run --no-build --project Sobakasu.StandardLibraryGenerator.Standalone.csproj -- --catalog "$missing"; then
            echo "Missing catalog unexpectedly succeeded." >&2
            exit 1
          fi
